name: CI

# Runs the test suite that already exists but had nothing running it.
# Kept dependency-free on purpose: no third-party actions, so there is no
# supply-chain surface in the job that gates merges.

on:
  push:
    branches: [integration/block-party, main]
  pull_request:
  workflow_dispatch:

# A newer push cancels a branch's running check, except on main: there every push gets a
# group of its own, so each ship's own run gives its verdict (four main runs in a row were
# cancelled on 2026-10-19, and bp-build's ci_wait.sh waits on its own sha's run).
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  ios-tests:
    name: iOS tests
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Pick the newest Xcode the runner has rather than pinning a version that
      # will rot. The project targets iOS 26.5, so an older Xcode cannot build it.
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      # Resolve a device at run time — runner simulator inventory changes without
      # warning. Ask xcodebuild what it will ACCEPT for this scheme rather than
      # asking simctl what exists: the runner carries several iOS runtimes, and
      # this app's deployment target (26.5) excludes the older ones. Picking from
      # simctl grabs the first iPhone regardless of runtime and fails with
      # "Unable to find a destination matching the provided destination specifier".
      - name: Resolve a simulator
        id: sim
        run: |
          set -euo pipefail
          # Once (2026-10-17) xcodebuild listed no simulator at all on a fresh runner and the
          # rerun found plenty: the simulator service can still be starting. Ask three times.
          udid=""
          for attempt in 1 2 3; do
            xcrun simctl list devices available >/dev/null 2>&1 || true
            dests="$(xcodebuild -showdestinations -project BlockParty.xcodeproj -scheme BlockParty 2>/dev/null \
                     | grep 'platform:iOS Simulator' | grep -v placeholder || true)"
            echo "Destinations xcodebuild accepts for this scheme (try $attempt):"
            echo "$dests"
            udid="$(echo "$dests" | grep 'name:iPhone' | head -1 \
                    | sed -E 's/.*id:([0-9A-Fa-f-]+).*/\1/' || true)"
            [ -n "$udid" ] && break
            [ "$attempt" -lt 3 ] && sleep 20
          done
          if [ -z "$udid" ]; then
            xcrun simctl list runtimes || true
            echo "::error::No iPhone simulator on this runner satisfies the app's deployment target"
            exit 1
          fi
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # MapboxConfig.swift and GooglePlacesConfig.swift are gitignored so the real
      # keys never land in this public repo — correct, but it means a fresh clone
      # cannot compile: BlockPartyApp.swift references MAPBOX_ACCESS_TOKEN and
      # GooglePlacesService.swift references GOOGLE_PLACES_API_KEY.
      #
      # The suite is pure logic (dates, garbage schedule, timezone, utility row,
      # onboarding) and never renders a map or calls Places, so placeholders are
      # enough to compile and test. Do NOT put real keys here — if a future test
      # genuinely needs one, use a repo secret and keep the placeholder fallback.
      #
      # BlockParty/ is an Xcode file-system-synchronized group, so files written
      # here are picked up automatically without touching project.pbxproj.
      - name: Generate placeholder config
        run: |
          set -euo pipefail
          mkdir -p BlockParty/Config
          if [ ! -f BlockParty/Config/MapboxConfig.swift ]; then
            echo 'let MAPBOX_ACCESS_TOKEN = "pk.ci-placeholder-not-a-real-token"' \
              > BlockParty/Config/MapboxConfig.swift
            echo "wrote placeholder MapboxConfig.swift"
          fi
          if [ ! -f BlockParty/Config/GooglePlacesConfig.swift ]; then
            echo 'let GOOGLE_PLACES_API_KEY = "ci-placeholder-not-a-real-key"' \
              > BlockParty/Config/GooglePlacesConfig.swift
            echo "wrote placeholder GooglePlacesConfig.swift"
          fi

      # No -testPlan flag: the shared scheme already points at BlockParty.xctestplan,
      # and naming it again is just another thing that can go stale.
      # Built once, then the unit tests, then the UI tests. A UI test that fails gets one
      # more try before the run goes red: EventCardPhotoTapTests failed twice on 2026-10-19
      # with no app change between green runs. Unit tests get no retry.
      # Piped through xcbeautify only when the runner has it, so a runner image
      # change cannot fail the build for a cosmetic reason.
      - name: Build and test
        run: |
          set -euo pipefail
          xcb() {
            xcodebuild "$@" \
              -project BlockParty.xcodeproj \
              -scheme BlockParty \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              CODE_SIGNING_ALLOWED=NO
          }
          run_tests() {
            xcb build-for-testing
            xcb test-without-building -only-testing:BlockPartyTests -resultBundlePath Unit.xcresult
            xcb test-without-building -only-testing:BlockPartyUITests -resultBundlePath UI.xcresult \
              -retry-tests-on-failure -test-iterations 2
          }
          if command -v xcbeautify >/dev/null 2>&1; then
            run_tests | xcbeautify
          else
            run_tests
          fi

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: |
            Unit.xcresult
            UI.xcresult
          retention-days: 7

  rules:
    name: Instruction files in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # AGENTS.md and CLAUDE.md are generated from rules/. This re-composes them
      # and fails on any difference, so a hand-edit cannot reach a branch even
      # when the pre-commit hook is bypassed with --no-verify.
      # scripts/ci_checks.sh holds the commands, so the pre-push hook runs the same ones.
      - name: Check generated instruction files and the generator's tests
        run: bash scripts/ci_checks.sh rules

  checks:
    name: Database and morning job checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # The database stories run the migrations in PGlite (Postgres compiled to WASM): no
      # Docker, no live data. They ran only when an agent remembered (BP app retro,
      # 2026-10-16). Node comes with the runner; package.json pins PGlite exactly and the
      # lock file stays out of git, so install rather than ci.
      - name: Database stories
        run: bash scripts/ci_checks.sh db

      # The registry's validator and the morning job's self-tests, all offline. Their libraries
      # are listed in sources/scripts/ci-packages.txt (import name, Ubuntu package); the runner's
      # system Python refuses pip installs.
      - name: Registry and morning job self-tests
        run: |
          set -euo pipefail
          list=sources/scripts/ci-packages.txt
          python3 -c "import $(awk '!/^#/ && NF {print $1}' $list | paste -sd, -)" 2>/dev/null ||
            { sudo apt-get update -qq && sudo apt-get install -y -qq $(awk '!/^#/ && NF {print $2}' $list); }
          bash scripts/ci_checks.sh registry
