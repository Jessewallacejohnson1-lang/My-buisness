<!doctype html>
<!-- TEMP preview of the real-photo weather backdrops. Safe to delete (public/wx-demo.html). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weather backdrops — real photos</title>
<style>
  :root { --paper:#fbfaf5; --ink:#2a2a28; --ink-2:#5b5b54; --ink-3:#8a8a80; }
  body { margin:0; background:var(--paper); font-family:-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); }
  .wrap { max-width:430px; margin:0 auto; padding:20px 0 60px; }
  h1 { font-size:18px; margin:18px 20px 4px; }
  p.note { font-size:12.5px; color:var(--ink-3); margin:0 20px 14px; }
  .label { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin:18px 20px 6px; }
  .bar { position:relative; overflow:hidden; border-top:1px solid rgba(0,0,0,.07); border-bottom:1px solid rgba(0,0,0,.07); }
  .barInner { position:relative; z-index:1; padding:11px 20px; display:flex; align-items:center; gap:10px; }
  .barInner span { text-shadow:0 1px 3px rgba(0,0,0,.55); }
  .temp { font-variant-numeric:tabular-nums; font-weight:600; font-size:16px; color:#fff; }
  .desc { font-size:13.5px; color:rgba(255,255,255,.92); }
  .spacer { flex:1; }
  .hl { font-variant-numeric:tabular-nums; font-size:12.5px; color:rgba(255,255,255,.85); }
  .glyph { width:18px; height:18px; border-radius:50%; background:#fff; opacity:.85; }
  @keyframes wxKen { 0% { transform:scale(1.06) translate(0,0);} 100% { transform:scale(1.16) translate(-2.5%,-2%);} }
  .wx-ken { position:absolute; inset:-8%; background-size:cover; background-repeat:no-repeat; filter:brightness(1.06) saturate(1.12) contrast(1.03); animation:wxKen 30s ease-in-out infinite alternate; transform-origin:60% 50%; }
  .veil { position:absolute; inset:0; background:linear-gradient(90deg, rgba(0,0,0,.52) 0%, rgba(0,0,0,.30) 36%, rgba(0,0,0,.10) 50%, rgba(0,0,0,.10) 60%, rgba(0,0,0,.30) 80%, rgba(0,0,0,.48) 100%); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Weather backdrops — real photos</h1>
  <p class="note">Same images & treatment as the app's weather bar: a real photo per live condition, slow Ken-Burns drift, linen veil so the text stays readable. Watch a few seconds to see the motion.</p>
  <div id="rows"></div>
</div>
<script>
const scenes = [
  ['Clear · day',        '/weather/clear-day.jpg',   '50% 50%', 72, 'Clear'],
  ['Clear · night',      '/weather/clear-night.jpg', '50% 28%', 58, 'Clear'],
  ['Partly cloudy',      '/weather/clouds.jpg',      '50% 50%', 70, 'Partly cloudy'],
  ['Overcast',           '/weather/overcast.jpg',    '50% 50%', 61, 'Cloudy'],
  ['Rain',               '/weather/rain.png',        '50% 50%', 54, 'Rain'],
  ['Snow',               '/weather/snow.jpg',        '50% 50%', 28, 'Snow'],
  ['Fog',                '/weather/fog.jpg',         '50% 50%', 49, 'Fog'],
  ['Thunderstorm',       '/weather/storm.jpg',       '50% 50%', 63, 'Storms'],
];
document.getElementById('rows').innerHTML = scenes.map(([name,img,pos,temp,desc]) => `
  <div class="label">${name}</div>
  <div class="bar">
    <div class="wx-ken" style="background-image:url('${img}');background-position:${pos}"></div>
    <div class="veil"></div>
    <div class="barInner">
      <span class="glyph"></span>
      <span class="temp">${temp}°</span>
      <span class="desc">${desc} in St. Joseph</span>
      <span class="spacer"></span>
      <span class="hl">H ${temp+6}°</span>
      <span class="hl">L ${temp-9}°</span>
    </div>
  </div>`).join('');
</script>
</body>
</html>
